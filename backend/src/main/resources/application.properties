spring.application.name=interview-preparation-bot

# Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen3:1.7b}
spring.ai.ollama.chat.think=${OLLAMA_CHAT_THINK:false}
spring.ai.ollama.chat.num-predict=${OLLAMA_CHAT_NUM_PREDICT:1024}
spring.ai.ollama.chat.temperature=${OLLAMA_CHAT_TEMPERATURE:0.2}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

# File Path
manifest.path=./data/document-manifest.json

spring.banner.location=classpath:./banner.txt

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

# Actuator
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.add-additional-paths=true

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/athena}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:athena}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:athena123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://13-235-77-33.sslip.io/login/oauth2/code/google

# GitHub OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri=https://13-235-77-33.sslip.io/login/oauth2/code/github

# Session
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

# Vector Store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.max-document-batch-size=100

# Cloudflare Turnstile
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
turnstile.secret=${TURNSTILE_SECRET}

# SMTP Configurations
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

athena.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
athena.feedback.to=${FEEDBACK_EMAIL:${MAIL_USERNAME}}

# Server Session
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true