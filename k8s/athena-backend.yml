apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: athena-backend
  template:
    metadata:
      labels:
        app: athena-backend
    spec:
      containers:
        - name: athena-backend
          image: athena-backend:1.0
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"
            - name: OLLAMA_CHAT_MODEL
              value: "qwen3:1.7b"
            - name: OLLAMA_EMBEDDING_MODEL
              value: "qwen3-embedding:0.6b"
