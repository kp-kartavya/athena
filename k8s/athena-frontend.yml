apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-frontend

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: athena-frontend

  template:
    metadata:
      labels:
        app: athena-frontend

    spec:
      containers:
        - name: athena-frontend
          image: athena-frontend:5.5
          imagePullPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-run
              mountPath: /tmp/nginx

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-logs
              mountPath: /var/log/nginx

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: nginx-run
          emptyDir: {}

        - name: nginx-cache
          emptyDir: {}

        - name: nginx-logs
          emptyDir: {}