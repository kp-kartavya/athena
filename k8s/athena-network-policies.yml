apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: athena-backend-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: athena-backend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: athena-frontend
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # Backend -> PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: athena-postgres
      ports:
        - protocol: TCP
          port: 5432

    # Backend -> Kubernetes DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Backend -> external services
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: athena-postgres-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: athena-postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: athena-backend
      ports:
        - protocol: TCP
          port: 5432